services:
  https:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${OFFICIAL_HTTPS_BIND:-127.0.0.1}:${OFFICIAL_HTTPS_PORT:-47831}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${OFFICIAL_TLS_DIR:-./tls}:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    depends_on:
      - cloud
    security_opt:
      - no-new-privileges:true
