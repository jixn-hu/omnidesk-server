services:
  cloud:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:47830:47830"
    environment:
      OFFICIAL_PUBLIC_URL: ${OFFICIAL_PUBLIC_URL:-}
      OFFICIAL_REGISTRATION: ${OFFICIAL_REGISTRATION:-false}
      OFFICIAL_TARGET_CIDRS: ${OFFICIAL_TARGET_CIDRS:-}
      OMNIDESK_WEBHOOK_URL: ${OMNIDESK_WEBHOOK_URL:-}
    volumes:
      - cloud-data:/data
      - account-data:/data/account
      - monitor-data:/data/monitor
    security_opt:
      - no-new-privileges:true
volumes:
  cloud-data:
    name: ${CLOUD_DATA_VOLUME:-omnidesk-cloud-data}
  account-data:
    name: ${OFFICIAL_DATA_VOLUME:-omnidesk-account-data}
  monitor-data:
    name: ${MONITOR_DATA_VOLUME:-omnidesk-monitor-data}
