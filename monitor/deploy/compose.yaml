services:
  monitor:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18088:18088"
    environment:
      OMNIDESK_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      OMNIDESK_WEBHOOK_URL: ${OMNIDESK_WEBHOOK_URL:-}
    secrets:
      - admin_token
    volumes:
      - monitor-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
secrets:
  admin_token:
    file: ./admin-token.txt
volumes:
  monitor-data:
